[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]
src_paths = ["app", "tests"]

[tool.mypy]
python_version = "3.13"
pretty = true
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = "(^alembic/|^check_.*\\.py$)"
