services:
  db: #can be used as hostname for the database connection
    image: postgres:17.10-bookworm #docker will use version 17.10 of postgres image with bookworm tag
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - simple-web-app_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /workspace/simple-web-app/backend
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./:/workspace/simple-web-app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    working_dir: /workspace/simple-web-app/frontend
    command: npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/workspace/simple-web-app/frontend
      - frontend_node_modules:/workspace/simple-web-app/frontend/node_modules

volumes:
  simple-web-app_postgres_data:
  frontend_node_modules:
